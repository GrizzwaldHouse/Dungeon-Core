<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1420" viewBox="0 0 1920 1420" role="img" aria-labelledby="title desc">
  <title id="title">Dungeon Core Crawler — visual direction board</title>
  <desc id="desc">Review board for five floor identities, desktop and mobile game UI, visual feedback, accessibility, and player decisions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111b"/><stop offset="1" stop-color="#172635"/></linearGradient>
    <linearGradient id="portal" x2="1" y2="1"><stop stop-color="#9cddcb"/><stop offset="1" stop-color="#607fc6"/></linearGradient>
    <linearGradient id="boss" x2="1" y2="1"><stop stop-color="#f0bd75"/><stop offset="1" stop-color="#a65476"/></linearGradient>
    <style>
      .title {font:700 46px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#f3eee2}
      .subtitle {font:20px 'Segoe UI',Arial,sans-serif;fill:#b9c7c5}
      .eyebrow {font:700 16px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#e5bd7e}
      .head {font:700 26px 'Segoe UI',Arial,sans-serif;fill:#f3eee2}
      .body {font:19px 'Segoe UI',Arial,sans-serif;fill:#c8d2cf}
      .small {font:16px 'Segoe UI',Arial,sans-serif;fill:#a8bbb9}
      .label {font:700 15px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#9cddcb}
      .card {fill:#142431;stroke:#42606b;stroke-width:2}
      .line {stroke:#42606b;stroke-width:2}
      .pill {fill:#253c47;stroke:#71938e;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1920" height="1420" fill="url(#bg)"/>
  <circle cx="1640" cy="110" r="240" fill="#2a665f" opacity=".13"/>
  <path d="M0 174H1920" class="line"/>
  <text x="68" y="72" class="eyebrow">DESIGN DIRECTION / REVIEW 01</text>
  <text x="68" y="127" class="title">DUNGEON CORE CRAWLER</text>
  <text x="1000" y="88" class="subtitle">Cooperative fantasy · shifting space · readable combat</text>
  <text x="1000" y="121" class="small">Design proposal grounded in the current dark stone / gold / mint UI</text>

  <text x="68" y="224" class="eyebrow">01 / FIVE-FLOOR STORY ARC</text>
  <g transform="translate(68 250)">
    <rect width="336" height="266" rx="18" class="card"/>
    <rect width="336" height="9" rx="5" fill="#9cddcb"/>
    <text x="24" y="52" class="label">FLOOR 01 / ARRIVAL</text>
    <text x="24" y="90" class="head">The Breach</text>
    <text x="24" y="126" class="body">Movement, secrets, Sentinel.</text>
    <text x="24" y="159" class="body">Teach by action, then shift.</text>
    <text x="24" y="206" class="small">Soft mint discovery glow</text>
    <text x="24" y="235" class="small">Gold portal = safe advance</text>
  </g>
  <g transform="translate(430 250)">
    <rect width="336" height="266" rx="18" class="card"/>
    <rect width="336" height="9" rx="5" fill="#ab8de0"/>
    <text x="24" y="52" class="label">FLOOR 02 / GUARDIANS</text>
    <text x="24" y="90" class="head">Twin Trials</text>
    <text x="24" y="126" class="body">Keeper charge → Hexer blast.</text>
    <text x="24" y="159" class="body">Shardling summons at thresholds.</text>
    <text x="24" y="206" class="small">Violet phase frames</text>
    <text x="24" y="235" class="small">Amber 1.5 s danger marks</text>
  </g>
  <g transform="translate(792 250)">
    <rect width="336" height="266" rx="18" class="card"/>
    <rect width="336" height="9" rx="5" fill="#8bc6a2"/>
    <text x="24" y="52" class="label">FLOOR 03 / GATHER</text>
    <text x="24" y="90" class="head">The Commons</text>
    <text x="24" y="126" class="body">Finite mob waves and caches.</text>
    <text x="24" y="159" class="body">Optional riches off the path.</text>
    <text x="24" y="206" class="small">Green supply silhouette</text>
    <text x="24" y="235" class="small">Personal claim confirmation</text>
  </g>
  <g transform="translate(1154 250)">
    <rect width="336" height="266" rx="18" class="card"/>
    <rect width="336" height="9" rx="5" fill="#eda66e"/>
    <text x="24" y="52" class="label">FLOOR 04 / TRIAL</text>
    <text x="24" y="90" class="head">Runic Circuit</text>
    <text x="24" y="126" class="body">Ordered puzzle, traps, guardian.</text>
    <text x="24" y="159" class="body">Mistakes warn before damage.</text>
    <text x="24" y="206" class="small">Numbered rune silhouettes</text>
    <text x="24" y="235" class="small">Warm orange warning pulse</text>
  </g>
  <g transform="translate(1516 250)">
    <rect width="336" height="266" rx="18" class="card"/>
    <rect width="336" height="9" rx="5" fill="url(#boss)"/>
    <text x="24" y="52" class="label">FLOOR 05 / CORE</text>
    <text x="24" y="90" class="head">Shifting Warden</text>
    <text x="24" y="126" class="body">Three phases; minion pressure.</text>
    <text x="24" y="159" class="body">Party victory loops stronger.</text>
    <text x="24" y="206" class="small">Gold-to-magenta corruption</text>
    <text x="24" y="235" class="small">Health phase marker 70 / 35%</text>
  </g>

  <text x="68" y="572" class="eyebrow">02 / INTERFACE COMPOSITION</text>
  <g transform="translate(68 600)">
    <rect width="1115" height="518" rx="20" fill="#0b1722" stroke="#71938e" stroke-width="2"/>
    <rect x="20" y="20" width="1075" height="54" rx="7" fill="#182d3a"/>
    <text x="42" y="55" class="head">DUNGEON CORE</text>
    <rect x="904" y="31" width="166" height="31" rx="14" class="pill"/>
    <text x="920" y="53" class="small">ROOM  AB2C</text>
    <path d="M190 444L355 150H760L932 444Z" fill="#223746" stroke="#537279" stroke-width="2"/>
    <path d="M327 444L439 198H666L791 444Z" fill="#283e4c"/>
    <path d="M473 318V210a79 79 0 0 1 158 0v108" fill="url(#portal)" opacity=".78"/>
    <ellipse cx="552" cy="392" rx="54" ry="20" fill="#77d9bd" opacity=".28"/>
    <circle cx="552" cy="360" r="28" fill="#d8c1a2" stroke="#9cddcb" stroke-width="5"/>
    <circle cx="355" cy="369" r="24" fill="#a87fc5" stroke="#d9c0e6" stroke-width="4"/>
    <circle cx="725" cy="364" r="26" fill="#b47757" stroke="#f0bd75" stroke-width="4"/>
    <circle cx="758" cy="319" r="41" fill="#7e3a58" stroke="#f0bd75" stroke-width="5"/>
    <ellipse cx="758" cy="366" rx="80" ry="24" fill="none" stroke="#ffc071" stroke-width="7" stroke-dasharray="16 11"/>
    <rect x="820" y="94" width="260" height="275" rx="12" fill="#10202d" stroke="#e5bd7e"/>
    <text x="838" y="126" class="label">YOUR EXPEDITION</text>
    <text x="838" y="158" class="body">Floor 02 · Twin Trials</text>
    <text x="838" y="187" class="small">Defeat the Mirror Hexer</text>
    <rect x="838" y="213" width="218" height="17" rx="8" fill="#42515b"/>
    <rect x="838" y="213" width="142" height="17" rx="8" fill="#b66784"/>
    <text x="838" y="261" class="small">Ally down · revive nearby</text>
    <rect x="838" y="281" width="218" height="55" rx="10" fill="#733f42" stroke="#ffb7a6"/>
    <text x="888" y="315" class="body">STRIKE  ·  SPACE</text>
    <rect x="20" y="453" width="593" height="44" rx="8" fill="#122837" stroke="#537279"/>
    <text x="39" y="481" class="small">✓ Guardian defeated   ·   Hold the portal together</text>
    <text x="632" y="481" class="small">HP 75/100   ·   Heal 1   ·   XP 240</text>
  </g>
  <text x="68" y="1149" class="small">DESKTOP PROPOSAL · preserve the existing full-screen viewport, room tag, expedition panel, and bottom status channel.</text>
  <g transform="translate(1234 600)">
    <rect width="345" height="518" rx="38" fill="#0b1722" stroke="#71938e" stroke-width="3"/>
    <rect x="17" y="24" width="311" height="41" rx="9" fill="#182d3a"/>
    <text x="30" y="51" class="small">CORE     ·     AB2C     ·     4/6</text>
    <path d="M30 358L95 117H251L314 358Z" fill="#253d4b"/>
    <path d="M125 252V161a47 47 0 0 1 94 0v91" fill="url(#portal)"/>
    <circle cx="173" cy="286" r="25" fill="#d8c1a2" stroke="#9cddcb" stroke-width="4"/>
    <circle cx="250" cy="247" r="28" fill="#7e3a58" stroke="#f0bd75" stroke-width="4"/>
    <ellipse cx="250" cy="280" rx="49" ry="15" fill="none" stroke="#ffc071" stroke-width="5" stroke-dasharray="9 7"/>
    <rect x="30" y="82" width="285" height="51" rx="10" fill="#132a36" stroke="#e5bd7e"/>
    <text x="42" y="104" class="small">FLOOR 02 · HEXER</text>
    <text x="42" y="124" class="small">Dodge the amber circle</text>
    <rect x="24" y="400" width="135" height="93" rx="12" fill="#203b48" stroke="#9cddcb"/>
    <text x="43" y="440" class="body">↑  ←  →</text>
    <text x="76" y="470" class="body">↓</text>
    <rect x="178" y="400" width="143" height="42" rx="12" fill="#883e3b" stroke="#ffb7a6"/>
    <text x="218" y="428" class="body">STRIKE</text>
    <rect x="178" y="451" width="66" height="42" rx="11" class="pill"/>
    <text x="189" y="478" class="small">HEAL</text>
    <rect x="253" y="451" width="68" height="42" rx="11" class="pill"/>
    <text x="263" y="478" class="small">MORE</text>
  </g>
  <text x="1234" y="1149" class="small">MOBILE PROPOSAL · visible thumb controls and condensed goals.</text>

  <text x="68" y="1210" class="eyebrow">03 / COLOR, FEEDBACK, AND REVIEW</text>
  <g transform="translate(68 1235)">
    <rect width="308" height="125" rx="12" fill="#0b111b" stroke="#71938e"/>
    <text x="20" y="36" class="label">NIGHT / STONE</text><text x="20" y="77" class="body">#0B111B  #293B48</text>
    <text x="20" y="105" class="small">Exploration foundation</text>
  </g>
  <g transform="translate(392 1235)">
    <rect width="308" height="125" rx="12" fill="#285952" stroke="#9cddcb"/>
    <text x="20" y="36" class="label" fill="#f3eee2">MINT / DISCOVERY</text><text x="20" y="77" class="body">#9CDDCB</text>
    <text x="20" y="105" class="small">Safe path and ally state</text>
  </g>
  <g transform="translate(716 1235)">
    <rect width="308" height="125" rx="12" fill="#60492e" stroke="#e5bd7e"/>
    <text x="20" y="36" class="label" fill="#f3eee2">GOLD / REWARD</text><text x="20" y="77" class="body">#E5BD7E</text>
    <text x="20" y="105" class="small">Portal and completion</text>
  </g>
  <g transform="translate(1040 1235)">
    <rect width="308" height="125" rx="12" fill="#753c37" stroke="#ffb7a6"/>
    <text x="20" y="36" class="label" fill="#f3eee2">AMBER / DANGER</text><text x="20" y="77" class="body">1.5 s warning</text>
    <text x="20" y="105" class="small">Pattern + audio + color</text>
  </g>
  <g transform="translate(1364 1235)">
    <rect width="488" height="125" rx="12" class="card"/>
    <text x="20" y="35" class="label">YOUR POLISH INPUT</text>
    <text x="20" y="67" class="small">1. More storybook wonder or darker combat?</text>
    <text x="20" y="94" class="small">2. Mobile: six buttons or context action?</text>
    <text x="20" y="119" class="small">3. Which boss silhouette feels most memorable?</text>
  </g>
</svg>
