name: Server check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: syntax_check
        run: npm run check
      - id: node_tests
        run: npm test
      - name: Summarize CI evidence
        if: always()
        env:
          SYNTAX_RESULT: ${{ steps.syntax_check.outcome }}
          TEST_RESULT: ${{ steps.node_tests.outcome }}
        run: |
          {
            echo '## Dungeon Core deterministic checks'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- JavaScript syntax: $SYNTAX_RESULT"
            echo "- Node tests: $TEST_RESULT"
            echo '- Evidence type: GitHub Actions on Ubuntu. Headed browser, physical phone, and public release gates remain open.'
          } >> "$GITHUB_STEP_SUMMARY"
