services:
  - type: web
    name: dungeon-core-crawler
    runtime: node
    plan: free
    branch: gameplay/release-integration
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_CLIENT_ORIGIN
        value: https://dungeon-core-crawler.vercel.app
